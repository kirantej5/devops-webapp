<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
  <title id="title">Orbit DevOps architecture</title>
  <desc id="desc">A developer pushes static web files to GitHub, GitHub Actions validates and builds a Docker image, and Nginx serves the app.</desc>
  <rect width="1000" height="400" rx="24" fill="#f7f7fc"/>
  <text x="50" y="52" fill="#202036" font-family="Arial,sans-serif" font-size="25" font-weight="700">Orbit delivery pipeline</text>
  <text x="50" y="80" fill="#8e8ea3" font-family="Arial,sans-serif" font-size="15">A small static app with a repeatable containerized path to production.</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="190" height="110" rx="16" fill="#6857e8"/><text x="150" y="188" fill="#fff" font-size="18" font-weight="700">Developer</text><text x="150" y="217" fill="#e7e3ff" font-size="14">git push</text>
    <rect x="290" y="145" width="190" height="110" rx="16" fill="#fff" stroke="#ddd9f8" stroke-width="3"/><text x="385" y="188" fill="#202036" font-size="18" font-weight="700">GitHub Actions</text><text x="385" y="217" fill="#8e8ea3" font-size="14">check · test · build</text>
    <rect x="525" y="145" width="190" height="110" rx="16" fill="#202036"/><text x="620" y="188" fill="#fff" font-size="18" font-weight="700">Docker image</text><text x="620" y="217" fill="#d6d5e3" font-size="14">Nginx + static files</text>
    <rect x="760" y="145" width="185" height="110" rx="16" fill="#43b795"/><text x="852" y="188" fill="#fff" font-size="18" font-weight="700">Browser</text><text x="852" y="217" fill="#e4fff7" font-size="14">localhost:8080</text>
  </g>
  <g fill="none" stroke="#aaa8bd" stroke-width="3" stroke-linecap="round"><path d="M245 200h35"/><path d="M480 200h35"/><path d="M715 200h35"/></g>
  <g fill="#aaa8bd"><path d="m270 190 15 10-15 10z"/><path d="m505 190 15 10-15 10z"/><path d="m740 190 15 10-15 10z"/></g>
  <text x="500" y="335" fill="#8e8ea3" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">HTML5 · CSS3 · Vanilla JavaScript · localStorage · Nginx</text>
</svg>
